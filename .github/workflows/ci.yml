name: CI - Test Food Ordering System

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint and run pytest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check (compile all Python files)
        run: python -m compileall -q app.py database.py tests

      - name: Import check
        env:
          DATABASE_PATH: ${{ runner.temp }}/import_check.db
        run: python -c "import app; print('app imports OK')"

      - name: Run pytest
        run: python -m pytest -v
