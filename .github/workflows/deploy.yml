name: CD - Deploy to Render

# Runs only after the CI workflow finishes successfully on main.
on:
  workflow_run:
    workflows: ["CI - Test Food Ordering System"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Trigger Render deployment
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check deploy hook secret exists
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_URL is not set. See README section 'Deployment'."
            exit 1
          fi

      - name: Call Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error -X POST "$HOOK"
